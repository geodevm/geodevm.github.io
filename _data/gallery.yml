# Photos for the Photo Gallery page, shown in this order.
#
# Each photo needs two copies with the same file name:
#   images/gallery/full/    the large version, shown when someone clicks
#   images/gallery/thumbs/  the small version, shown in the grid
# scripts/resize_photos.py makes both and prints entries you can paste below.
#
# Fields for each photo:
#   file:     the file name (required)
#   caption:  text shown under the full-size photo (optional)
#   alt:      a short description of the photo for people using screen readers
#   focus:    which part stays visible when the grid crops the photo to a square
#             (optional): top, bottom, left, right, or two percentages like "50% 30%"
#             (left-right, then top-bottom). Leave it out to keep the center.
#
