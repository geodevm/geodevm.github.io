{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Background photo. To change it, replace images/background.jpg. To remove it, delete this block. -->
<style>
  body {
    background-color: transparent;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding-bottom: 0;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: url("{{ base_path }}/images/background.jpg");
    background-size: cover;
    background-position: center;
  }
  #main {
    flex: 1 0 auto;
    width: 100%;
    margin-top: -1em;
    padding-top: 2.5em;
    padding-bottom: 1.5em;
    background-color: color-mix(in srgb, var(--global-bg-color) 82%, transparent);
  }
  .page__footer {
    position: static;
    margin-top: 0;
    margin-bottom: 75vh;
  }
</style>

<!-- Sidebar: scrolls with the panel instead of being pinned to the window, so it can't overlap the footer. -->
<style>
  @media screen and (min-width: 1024px) {
    .sidebar {
      position: sticky;
      top: var(--sidebar-top, 70px);
      height: auto;
      max-height: none;
      overflow: visible;
      padding-top: 0;
    }
  }
</style>
<script>
  (function () {
    /* If the sidebar is taller than the window, let it scroll until its bottom is in view, then hold it there. */
    function fit() {
      var s = document.querySelector(".sidebar");
      if (!s) { return; }
      var top = Math.min(70, window.innerHeight - s.offsetHeight - 16);
      s.style.setProperty("--sidebar-top", top + "px");
    }
    document.addEventListener("DOMContentLoaded", function () {
      fit();
      var s = document.querySelector(".sidebar");
      if (s && window.ResizeObserver) { new ResizeObserver(fit).observe(s); }
      window.addEventListener("resize", fit);
      window.addEventListener("load", fit);
    });
  })();
</script>

<!-- end custom head snippets -->
